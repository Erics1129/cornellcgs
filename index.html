<!doctype html>
<html lang="en" data-theme="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cornell CGS — Computational Game Society</title>
    <meta name="description" content="The Cornell Computational Game Society. We study games with code — solvers, agents, and the math behind every hand." />
    <meta property="og:title" content="Cornell CGS — Computational Game Society" />
    <meta property="og:description" content="Games, solved with computers. A Cornell student organization for game theory, solvers and learning agents." />
    <meta property="og:url" content="https://cornellcgs.org" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230B0B0F'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23EFE6D2'%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400..800;1,400..700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // If this HTML was cached across a deploy, its bundle URL may be dead
      // and the app would never boot. Recover with ONE cache-busting reload.
      ;(function () {
        try {
          var u = new URL(location.href)
          window.__cgsBootTimer = setTimeout(function () {
            if (window.__cgsBooted || u.searchParams.has('rl')) return
            u.searchParams.set('rl', String(Date.now()))
            location.replace(u.toString())
          }, 4000)
        } catch (e) {
          /* very old browser — nothing to do */
        }
      })()
    </script>
    <style>
      /* Paint the world color before any JS or CSS loads — no white flash. */
      html { background: #04081c; }
      html[data-theme='red'] { background: #060427; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
