    />
    <script>
      // If this HTML was cached across a deploy, its bundle URL may be dead
      // and the app would never boot. Recover with ONE cache-busting reload.
      ;(function () {
        try {
          var u = new URL(location.href)
          window.__cgsBootTimer = setTimeout(function () {
            if (window.__cgsBooted || u.searchParams.has('rl')) return
            u.searchParams.set('rl', String(Date.now()))
            location.replace(u.toString())
          }, 4000)
        } catch (e) {
          /* very old browser — nothing to do */
        }
      })()
    </script>
    <style>
      /* Paint the world color before any JS or CSS loads — no white flash. */
      html { background: #04081c; }
      html[data-theme='sky'] { background: #dfeeff; }
      html[data-theme='lilac'] { background: #efe6ff; }
      html[data-theme='violet'] { background: #0e0620; }
      html[data-theme='black'] { background: #000000; }
