<!doctype html>
<!-- The film site: the home page and every page that is not a mini game (SITE.md, "The real repo"). The film itself is
     the tree in public/film/ (plain ES modules, copied from the redesign by scripts/film-sync.mjs); src/main.tsx starts
     it. scripts/vite-film-shell.mjs fills each film:* marker at build time (and in dev) from src/film-shell/:
     the words builder's head, site.html's inline loader, the import map, the first screen's modulepreload links
     (public/film/preload.json) and the body with every word of the site. scripts/stubs.mjs writes the other pages
     from the built copy. The mini games' page is game-shell.html. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- site/host.js: the live host (real paths, no Build notes) -->
    <meta name="cgs-host" content="live" />
    <!--film:head-->
    <script>
      // If this HTML was cached across a deploy, its bundle URL may be dead and the site would never start.
      // Recover with ONE cache-busting reload (src/main.tsx sets __cgsBooted first thing).
      ;(function () {
        try {
          var u = new URL(location.href)
          window.__cgsBootTimer = setTimeout(function () {
            if (window.__cgsBooted || u.searchParams.has('rl')) return
            u.searchParams.set('rl', String(Date.now()))
            location.replace(u.toString())
          }, 4000)
        } catch (e) {
          /* very old browser: nothing to do */
        }
      })()
    </script>
    <!--film:loader-->
    <!-- the import map goes before the first module the page asks for (Vite would move it there anyway) -->
    <!--film:importmap-->
    <!-- Vite puts the main entry here (src/main.tsx, built tiny; asked for first, so the boot guard above never
         fires on a slow line), then the first screen's modules are asked for at the top of the body. Never write the
         built entry's file name in a comment: fast-deploy.sh greps this page for it. -->
  </head>
  <body>
    <!--film:preload-->
    <!--film:body-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
