<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fold — Cornell CGS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@650&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html { background: #171209; }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        font-family: 'JetBrains Mono', monospace;
        color: #ccc3b3;
        background:
          radial-gradient(120% 55% at 50% 110%, rgba(208, 166, 94, 0.5), transparent 70%),
          linear-gradient(to bottom, #171209 0%, #554221 70%, #9c8357 100%);
        perspective: 1100px;
      }
      .card {
        width: 200px;
        height: 280px;
        position: relative;
        transform-style: preserve-3d;
        animation: flip 1.1s 0.55s cubic-bezier(0.34, 1.3, 0.44, 1) forwards;
        cursor: default;
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }
      .back {
        background: radial-gradient(90% 70% at 50% 40%, #322b1e 0%, #201b12 60%, #18130c 100%);
        box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.65);
        color: #d3d0cc;
        font-size: 2.4rem;
      }
      .back::before {
        content: '';
        position: absolute;
        inset: 7%;
        border: 1.5px solid rgba(211, 208, 204, 0.6);
        border-radius: 10px;
      }
      .front {
        background: radial-gradient(120% 90% at 50% 0%, #f6efdd 0%, #efe6d2 55%, #e3d7bc 100%);
        color: #0e0d0c;
        transform: rotateY(180deg);
        box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.65);
        font-family: 'Hanken Grotesk', sans-serif;
      }
      .front .word { font-size: 2.6rem; font-weight: 650; }
      .front .sub { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #7a6a4a; }
      @keyframes flip {
        to { transform: rotateY(180deg); }
      }
      a { color: #f9f5ee; text-decoration: none; border-bottom: 1px solid #d7b376; padding-bottom: 2px; }
      a:hover { color: #ffffff; }
      p { font-size: 15px; }
      @media (prefers-reduced-motion: reduce) {
        .card { animation: none; transform: rotateY(180deg); }
      }
    </style>
  </head>
  <body>
    <div class="card" aria-hidden="true">
      <div class="face back">♠</div>
      <div class="face front">
        <span class="word">Fold.</span>
        <span class="sub">Nothing here.</span>
      </div>
    </div>
    <p><a href="/">Back to the table</a></p>
  </body>
</html>
